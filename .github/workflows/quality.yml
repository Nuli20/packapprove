name: Product quality (isolated Supabase)
on:
  pull_request:
  push:
    branches: [feat/product-quality-pass]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select installed Chromium
        run: node -e 'console.log("CHROMIUM_PATH="+require("@playwright/test").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Start disposable local Auth, PostgreSQL and private Storage
        run: npm run local:up
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:doctor
      - run: npm run db:test-migrations
      - run: npm run build
      - name: Browser checks with a restricted runtime login
        shell: bash
        run: |
          node --import tsx scripts/serve-restricted-demo.ts --port 3030 > /tmp/packapprove-server.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" || true' EXIT
          for n in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3030/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3030/api/health > /dev/null
          failed=0
          # Both complete suites use the same isolated stack: leaked state must fail, not be reset away.
          # Preserve either failure; this is a repeatability check, not a retry-until-green.
          for repeat in 1 2; do
            PACKAPPROVE_TEST_ORIGIN=http://127.0.0.1:3030 PACKAPPROVE_E2E_RUN="$repeat" \
              npm run test:e2e -- --output=".data/e2e-$repeat" || failed=1
          done
          exit "$failed"
      - name: Safe E2E diagnostics (no request data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-diagnostics
          path: .data/ci-diagnostics/*.json
          if-no-files-found: ignore
      # Traces, HTML reports, .env files and one-use invitation links are deliberately not uploaded.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: browser-screenshots
          path: .data/quality-ui/*.png
          if-no-files-found: ignore
